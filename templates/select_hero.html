<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выберите героя - Dota 2 Random Build</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Выберите героя</h1>
            <p>Выберите героя для генерации билда или используйте случайного</p>
            <div class="actions">
                <a href="/" class="back-btn">← На главную</a>
                <a href="/generate" class="generate-btn">Случайный герой</a>
            </div>
        </header>
        
        <main>
            <div class="hero-selection">
                <div class="hero-grid">
                    {% for hero in heroes %}
                    <a href="/generate?hero={{ hero.name }}" class="hero-card">
                        <div class="hero-image-container">
                            <img src="{{ hero.image_url }}" alt="{{ hero.name }}" class="hero-thumbnail">
                        </div>
                        <div class="hero-name">{{ hero.name }}</div>
                        <div class="hero-select-label">Выбрать</div>
                    </a>
                    {% endfor %}
                </div>
            </div>
        </main>
        
        <footer>
            <p>Выберите героя для получения индивидуального билда</p>
        </footer>
    </div>
</body>
</html>
